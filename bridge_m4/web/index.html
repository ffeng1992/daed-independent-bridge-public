<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>独立 DAE 管理</title><link rel="stylesheet" href="/style.css"><main><h1>独立 DAE 管理</h1><p>daed 页面负责配置管理；本页面负责最新独立 DAE 的扩展配置、应用和生命周期。daed 原生 Run 不是独立 DAE 控制入口。</p><form id="login"><label>独立 Bridge 登录令牌 <input name="token" type="password" autocomplete="off" required></label><p>与官方 daed 账号无关。首次配置请先访问官方 2023 页面，再由管理员授权 Bridge 连接。</p><button>登录</button></form><section id="management" hidden><nav><button id="refresh">刷新真实状态</button><button id="logout">退出</button></nav><h2>独立 DAE 真实状态</h2><dl id="status"></dl><h2>daed 配置与源快照</h2><p>节点、订阅、分组、DNS、路由及普通全局字段请在官方 daed 页面修改。</p><button id="preview">采集与差异预览</button><pre id="preview-result"></pre><button id="validate" disabled>官方 validate</button><button id="apply" disabled>应用候选</button><h2>bridge 管理的 DAE 扩展</h2><p>“未设置”和 false、true 是不同状态。保存扩展不会写入 daed 数据库。</p><div id="extensions"></div><h2>生命周期</h2><div id="actions"><button data-action="start">启动</button><button data-action="stop">停止</button><button data-action="reload">重载</button><button data-action="recover">恢复未完成事务</button></div></section><p id="message" role="status"></p></main><script src="/app.js"></script></html>
